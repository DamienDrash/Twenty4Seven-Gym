name: tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

# Tests only — no deploy. Freigegeben von Damien am 05.08.2026 (Roadmap-Frage 4).
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Pytest
        run: |
          python -m pytest tests/ -q
